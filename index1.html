<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intermediate HTML CSS JS Task</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f4f4f4;
        }

        

        .navbar{
            background:teal;
            color:white;
            padding:15px 30px;

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .nav-links{
            display:flex;
            list-style:none;
            gap:20px;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        

        .container{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:30px;

            padding:30px;
        }

        

        .form-section,
        .todo-section{
            background:white;
            padding:25px;
            border-radius:10px;

            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        h2{
            color:teal;
            margin-bottom:20px;
        }

        .input-group{
            margin-bottom:15px;
        }

        .input-group label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        .input-group input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            background:teal;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:darkcyan;
        }

        .error{
            color:red;
            font-size:14px;
        }

        

        .todo-input{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }

        .todo-input input{
            flex:1;
            padding:10px;
        }

        #taskList{
            list-style:none;
        }

        #taskList li{
            background:#e8f8f8;
            margin-bottom:10px;
            padding:10px;

            display:flex;
            justify-content:space-between;
            align-items:center;

            border-radius:5px;
        }

        .delete-btn{
            background:crimson;
        }

        

        @media(max-width:768px){

            .container{
                grid-template-columns:1fr;
            }

            .navbar{
                flex-direction:column;
                gap:10px;
            }

            .nav-links{
                flex-direction:column;
                align-items:center;
            }
        }

    </style>
</head>

<body>

    

    <header>
        <nav class="navbar">

            <h1>ApexPlanet Task</h1>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

        </nav>
    </header>

    <!-- Main Container -->

    <main class="container">

        <!-- Contact Form -->

        <section class="form-section">

            <h2>Contact Form</h2>

            <form id="contactForm">

                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                    <small class="error"></small>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <small class="error"></small>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                    <small class="error"></small>
                </div>

                <button type="submit">Submit</button>

            </form>

        </section>

        

        <section class="todo-section">

            <h2>Dynamic To-Do List</h2>

            <div class="todo-input">

                <input type="text" id="taskInput" placeholder="Enter task">

                <button id="addTaskBtn">
                    Add Task
                </button>

            </div>

            <ul id="taskList"></ul>

        </section>

    </main>

    <script>

        

        const form = document.getElementById("contactForm");

        form.addEventListener("submit", function(event){

            event.preventDefault();

            let isValid = true;

            const name = document.getElementById("name");
            const email = document.getElementById("email");
            const password = document.getElementById("password");

            const errors = document.querySelectorAll(".error");

            errors.forEach(error => error.textContent = "");

            

            if(name.value.trim() === ""){
                errors[0].textContent = "Name is required";
                isValid = false;
            }

            

            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if(email.value.trim() === ""){
                errors[1].textContent = "Email is required";
                isValid = false;
            }
            else if(!email.value.match(emailPattern)){
                errors[1].textContent = "Enter valid email";
                isValid = false;
            }

            

            if(password.value.trim() === ""){
                errors[2].textContent = "Password is required";
                isValid = false;
            }
            else if(password.value.length < 6){
                errors[2].textContent = "Minimum 6 characters";
                isValid = false;
            }

            

            if(isValid){
                alert("Form Submitted Successfully!");
                form.reset();
            }

        });


        

        const addTaskBtn =
        document.getElementById("addTaskBtn");

        const taskInput =
        document.getElementById("taskInput");

        const taskList =
        document.getElementById("taskList");

        addTaskBtn.addEventListener("click", function(){

            const taskText = taskInput.value.trim();

            if(taskText === ""){
                alert("Please enter a task");
                return;
            }

            const li = document.createElement("li");

            li.innerHTML = `
                ${taskText}
                <button class="delete-btn">Delete</button>
            `;

            li.querySelector(".delete-btn")
            .addEventListener("click", function(){

                li.remove();

            });

            taskList.appendChild(li);

            taskInput.value = "";

        });

    </script>

</body>
</html>
